services:
  backend-prod:
    image: ghcr.io/sashkeee/orangebrew/backend-prod:latest
    container_name: orangebrew-backend-prod
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_PATH=/app/data/orangebrew.db
      - CONNECTION_TYPE=mock
      - NODE_ENV=production
      - LOG_FORMAT=json
      - APP_ENV=prod
      - SERVICE_VERSION=${SERVICE_VERSION:-unknown}
      - EVENTS_CAPTURE_ENABLED=${EVENTS_CAPTURE_ENABLED:-true}
      - KAFKA_PUBLISH_ENABLED=${KAFKA_PUBLISH_ENABLED:-false}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-}
      - NOTIFICATIONS_TRANSPORT=${NOTIFICATIONS_TRANSPORT:-direct}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - orangebrew-data-prod:/app/data
    labels:
      orangebrew_collect: "true"
      orangebrew_env: prod
      orangebrew_service: backend
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "10"}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  frontend-prod:
    image: ghcr.io/sashkeee/orangebrew/frontend-prod:latest
    container_name: orangebrew-frontend-prod
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/orangebrew.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      orangebrew_collect: "true"
      orangebrew_env: prod
      orangebrew_service: proxy
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    restart: unless-stopped
    depends_on:
      - backend-prod
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 512M

volumes:
  orangebrew-data-prod:
