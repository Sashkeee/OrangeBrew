name: deploy-test

on:
  push:
    branches: [ develop ]

permissions:
  packages: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/sashkeee/orangebrew/backend-test:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/sashkeee/orangebrew/frontend-test:latest

      - name: Copy deploy files via scp
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.test.yml,docker-compose.kafka.yml,docker-compose.observability.yml,infra,Caddyfile"
          target: "~/OrangeBrew"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/OrangeBrew
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            set -- -f docker-compose.test.yml
            if [ -f .kafka-enabled-test ]; then
              set -- "$@" -f docker-compose.kafka.yml
            fi
            docker compose "$@" pull backend-test frontend-test
            # Application deploys never restart stateful Kafka/Elastic services.
            docker compose "$@" up -d backend-test frontend-test
            # Remove only the retired logging container; preserve application volumes.
            if docker container inspect orangebrew-vector-test >/dev/null 2>&1; then
              docker container rm -f orangebrew-vector-test
            fi
            caddy reload --config ~/OrangeBrew/Caddyfile
