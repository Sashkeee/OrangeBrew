input {
  kafka {
    bootstrap_servers => "${KAFKA_BROKERS}"
    security_protocol => "SASL_SSL"
    sasl_mechanism => "${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}"
    sasl_jaas_config => "${KAFKA_JAAS_CONFIG}"
    ssl_truststore_location => "/usr/share/logstash/config/certs/kafka.truststore.p12"
    ssl_truststore_password => "${KAFKA_TRUSTSTORE_PASSWORD}"
    ssl_truststore_type => "PKCS12"
    ssl_endpoint_identification_algorithm => "https"
    topics => ["orangebrew.${APP_ENV}.logs.backend.v1", "orangebrew.${APP_ENV}.logs.device.v1", "orangebrew.${APP_ENV}.logs.proxy.v1"]
    group_id => "orangebrew-${APP_ENV}-logs-indexer-v1"
    client_id => "orangebrew-${APP_ENV}-logstash"
    enable_auto_commit => false
    auto_offset_reset => "earliest"
    decorate_events => "basic"
    codec => json { ecs_compatibility => "v8" }
  }
}
filter {
  ruby {
    path => "/usr/share/logstash/config/normalize.rb"
    script_params => { "environment" => "${APP_ENV}" }
  }
}
output {
  if [@metadata][quarantine] {
    kafka {
      bootstrap_servers => "${KAFKA_BROKERS}"
    security_protocol => "SASL_SSL"
    sasl_mechanism => "${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}"
    sasl_jaas_config => "${KAFKA_JAAS_CONFIG}"
    ssl_truststore_location => "/usr/share/logstash/config/certs/kafka.truststore.p12"
    ssl_truststore_password => "${KAFKA_TRUSTSTORE_PASSWORD}"
    ssl_truststore_type => "PKCS12"
    ssl_endpoint_identification_algorithm => "https"
      topic_id => "orangebrew.${APP_ENV}.logs.quarantine.v1"
      codec => json
      acks => "all"
      compression_type => "gzip"
      client_id => "orangebrew-${APP_ENV}-quarantine"
    }
  } else {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_URL}"]
      ssl_enabled => true
      user => "${LOGSTASH_USERNAME:orangebrew_ingest}"
      password => "${LOGSTASH_PASSWORD}"
      ssl_certificate_authorities => ["/usr/share/logstash/config/certs/elastic-ca.crt"]
      ssl_verification_mode => "full"
      ecs_compatibility => "v8"
      data_stream => "true"
      # normalize.rb assigns these routing fields from trusted deployment data.
      data_stream_auto_routing => true
      data_stream_type => "logs"
      data_stream_dataset => "orangebrew.backend"
      data_stream_namespace => "${APP_ENV}"
      manage_template => false
      action => "create"
      dlq_custom_codes => [413]
    }
  }
}
