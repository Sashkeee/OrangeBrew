# Only an allowlisted JSON access log is shipped. No query string, headers,
# credentials, cookies, referrer, remote IP or request body enter this format.
log_format orangebrew_ecs escape=json '{"@timestamp":"$time_iso8601","message":"HTTP request completed","log":{"level":"info","logger":"nginx"},"http":{"request":{"method":"$request_method"},"response":{"status_code":$status}},"url":{"path":"$uri"},"orangebrew_duration_seconds":$request_time}';
server {
    listen 80;
    access_log /dev/stdout orangebrew_ecs;
    error_log /dev/stderr warn;
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
