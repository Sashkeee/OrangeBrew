# Low-volume canary on a disposable CI runner. Not production sizing.
services:
  elasticsearch:
    environment:
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 2g
  kafka:
    environment:
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    mem_limit: 1g
  logstash:
    command: ["logstash", "--log.level", "info"]
    environment:
      LS_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 1536m
  kibana:
    environment:
      APP_ENV: ${APP_ENV:-test}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:?Generate .env.observability first}
    volumes:
      - ./infra/observability:/smoke:ro
