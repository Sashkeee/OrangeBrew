services:
  backend-test:
    image: ghcr.io/sashkeee/orangebrew/backend-test:latest
    container_name: orangebrew-backend-test
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_PATH=/app/data/orangebrew.db
      - CONNECTION_TYPE=mock
      - NODE_ENV=development
      - LOG_FORMAT=json
      - APP_ENV=test
      - SERVICE_VERSION=${SERVICE_VERSION:-unknown}
      - EVENTS_CAPTURE_ENABLED=${EVENTS_CAPTURE_ENABLED:-true}
      - KAFKA_PUBLISH_ENABLED=${KAFKA_PUBLISH_ENABLED:-false}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-}
      - NOTIFICATIONS_TRANSPORT=${NOTIFICATIONS_TRANSPORT:-direct}
      - JWT_SECRET=${JWT_SECRET}
      - SWAGGER_ENABLED=true
    volumes:
      - orangebrew-data-test:/app/data
    labels:
      orangebrew_collect: "true"
      orangebrew_env: test
      orangebrew_service: backend
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "10"}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  frontend-test:
    image: ghcr.io/sashkeee/orangebrew/frontend-test:latest
    container_name: orangebrew-frontend-test
    ports:
      - "8081:80"
    volumes:
      - ./infra/nginx/orangebrew.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      orangebrew_collect: "true"
      orangebrew_env: test
      orangebrew_service: proxy
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    restart: unless-stopped
    depends_on:
      - backend-test
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 512M

volumes:
  orangebrew-data-test:
